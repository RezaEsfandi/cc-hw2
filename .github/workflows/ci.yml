name: Queue CI and release

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  VERSION: v1.0.${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.11.13
      - run: ruff check part2/app/
      - uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: part2/Dockerfile

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: part2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build queue image
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t lab-queue:ci part2
      - if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: docker save lab-queue:ci | gzip -1 > lab-queue.tar.gz
      - if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: lab-queue
          path: lab-queue.tar.gz
          compression-level: 0
          retention-days: 7
          overwrite: true

  push:
    needs: build
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    outputs:
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab-queue
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image from the build job
        id: publish
        run: |
          docker load -i lab-queue.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lab-queue"
          docker tag lab-queue:ci "$image:$VERSION"
          docker tag lab-queue:ci "$image:latest"
          docker push "$image:$VERSION"
          docker push "$image:latest"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - if: vars.PUBLISH_CC_HELLO == 'true'
        uses: actions/checkout@v4
      - name: Publish the Part 1 slim example
        if: vars.PUBLISH_CC_HELLO == 'true'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cc-hello:slim"
          docker build -f part1/Dockerfile.slim \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$image" part1
          docker push "$image"
          docker image rm "$image"
          docker pull "$image"
          docker run --rm "$image"

  tag:
    needs: push
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.push.outputs.version }}
    outputs:
      version: ${{ needs.push.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION from $GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

  pages:
    needs: tag
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: sed -i "s/__VERSION__/$VERSION/" part2/site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: part2/site
      - uses: actions/deploy-pages@v4
        id: deployment
